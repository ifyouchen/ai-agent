version: "3.9"

# ============================================================
# AI Agent 本地开发 / 测试环境一键启动
#
# 使用方式：
#   docker compose up -d          # 后台启动所有服务
#   docker compose up -d postgres redis   # 只启动依赖，本地跑 Java
#   docker compose logs -f app    # 查看应用日志
#   docker compose down -v        # 停止并清除数据卷
# ============================================================

services:

  # ── PostgreSQL + pgvector ────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-postgres
    environment:
      POSTGRES_DB: aiagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-127.0.0.1:15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru;
        else
          exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      '
    ports:
      - "${REDIS_PORT:-127.0.0.1:16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Elasticsearch（可选，BM25 混合检索）──────────────────
  elasticsearch:
    image: elasticsearch:8.11.4
    container_name: ai-agent-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - bm25   # 默认不启动，用 --profile bm25 启用

  # ── Spring Boot 应用 ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: aiagent
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT（生产环境必须修改！）
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production-min-32-chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      # LLM API Key
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      QIANFAN_BASE_URL: ${QIANFAN_BASE_URL:-https://qianfan.baidubce.com/v2}
      QIANFAN_EMBEDDING_MODEL: ${QIANFAN_EMBEDDING_MODEL:-bge-large-zh}
      # 邮件验证码
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      AUTH_EMAIL_FROM: ${MAIL_FROM:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-deepseek}
      # 告警（可选）
      ALERT_DINGTALK_ENABLED: ${ALERT_DINGTALK_ENABLED:-false}
      ALERT_DINGTALK_WEBHOOK: ${ALERT_DINGTALK_WEBHOOK:-}
    ports:
      - "${APP_PORT:-127.0.0.1:18080}:8080"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── 独立前端（Node.js + Vite）────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8080}
    container_name: ai-agent-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-127.0.0.1:14173}:4173"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  es_data:
  app_logs:
