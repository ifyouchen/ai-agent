spring:
  profiles:
    active: deepseek   # 切换为 claude 即可换模型
  servlet:
    multipart:
      max-file-size: 50MB        # 单个文件最大大小
      max-request-size: 100MB    # 整个请求最大大小（支持多文件上传）
  mail:
    host:
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: localhost
      port: 6379
      password:

  datasource:
    url: jdbc:postgresql://localhost:5432/aiagent
    username: chenzhixia
    password: 12345678
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*.xml      # XML 映射文件位置
  type-aliases-package: com.example.aiagent     # 实体类别名扫描包
  configuration:
    map-underscore-to-camel-case: true          # 自动将 snake_case 列名映射为 camelCase 字段
    default-fetch-size: 100
    default-statement-timeout: 30              # SQL 超时（秒）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期打印 SQL，生产注释掉

server:
  port: 8080

# 链路追踪（Zipkin）
# 开发环境未启动 Zipkin 时设为 never，避免连接错误日志
management:
  tracing:
    sampling:
      probability: 0.0    # 采样率 0 = 不上报（开发环境）
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      export:
        enabled: false    # 不向 Zipkin 上报

# 日志
logging:
  level:
    com.example.aiagent: DEBUG
    dev.langchain4j: DEBUG

# Agent 配置
agent:
  memory:
    max-messages: 20          # 每个会话保留最近 N 条消息
    ttl-hours: 24             # Redis 中的记忆过期时间（小时）
  rag:
    max-results: 3            # RAG 检索返回最相关 N 段
    min-score: 0.7            # 相似度阈值（低于此值不返回）
    chunk-size: 500           # 文档切片大小（字符数）
    chunk-overlap: 50         # 切片重叠（避免信息截断）
    embedding-batch-size: 16  # Embedding API 单次批量上限（百度千帆 bge-large-zh 最大 16；OpenAI 可设 256）

# ==================== 混合 RAG 配置 ====================
rag:
  # 查询改写
  query:
    rewrite:
      variants: 2              # 改写变体数（越多效果越好，但越慢）

  # 向量检索
  retrieval:
    vector:
      top-k: 20                # 向量检索初始召回数
      threshold: 0.5           # 最低相似度阈值
    rrf:
      top-k: 10                # RRF 融合后保留数

  # Reranker 精排
  reranker:
    # 可选值：
    #   llm    - 内置 LLM 打分（默认，无额外依赖，利用已有 LLM）
    #   tfidf  - 内置 TF-IDF（纯 Java，延迟极低，无网络调用，效果较弱）
    #   bge    - 外部 BGE Python 服务（精度最高，需另行部署 Python 推理服务）
    #   cohere - Cohere Rerank API（云端，需 API Key）
    type: llm
    top-k: 5                   # 最终送给 LLM 的上下文数
    llm:
      batch-size: 5            # 每批发给 LLM 评分的文档数（避免超长 Prompt）
    bge:
      url: http://localhost:8090/rerank
    cohere:
      api-key:
      model: rerank-multilingual-v3.0

  # 内嵌 BM25 检索（基于 Apache Lucene，无需外部服务，始终可用）
  bm25:
    k1: 1.2                # BM25 词频饱和参数（推荐 1.2~2.0）
    b:  0.75               # BM25 文档长度归一化参数（推荐 0.5~0.9）

  # Elasticsearch（外部 BM25 检索，可选，需部署 ES 服务才能启用）
  # 启用后 Bm25Retriever 同时使用 Lucene（内嵌）和 ES（外部）双路 BM25，效果更好
  elasticsearch:
    enabled: false              # 设为 true 启用外部 ES（默认关闭，内嵌 Lucene 始终可用）
    host: localhost
    port: 9200
    index-name: rag-documents
    username:                   # 留空表示无认证（开发环境）
    password:
    # IK 中文分词器（需安装插件：bin/elasticsearch-plugin install analysis-ik）
    # 未安装时设为 false，自动使用 standard 分词器（英文效果好，中文效果较差）
    ik-analyzer: true

