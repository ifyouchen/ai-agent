spring:
  profiles:
    active: deepseek   # 切换为 claude 即可换模型
  mail:
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:aiagent}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true        # 已有数据库时自动打基线，不报错
    validate-on-migrate: true        # 迁移前校验 checksum，防止文件被篡改

mybatis:
  mapper-locations: classpath:mapper/*.xml      # XML 映射文件位置
  type-aliases-package: com.example.aiagent     # 实体类别名扫描包
  configuration:
    map-underscore-to-camel-case: true          # 自动将 snake_case 列名映射为 camelCase 字段
    default-fetch-size: 100
    default-statement-timeout: 30              # SQL 超时（秒）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期打印 SQL，生产注释掉

server:
  port: 8080

# 日志
logging:
  level:
    com.example.aiagent: DEBUG
    dev.langchain4j: DEBUG

# Agent 配置
agent:
  memory:
    max-messages: 20          # 每个会话保留最近 N 条消息
    ttl-hours: 24             # Redis 中的记忆过期时间（小时）
  rag:
    max-results: 3            # RAG 检索返回最相关 N 段
    min-score: 0.7            # 相似度阈值（低于此值不返回）
    chunk-size: 500           # 文档切片大小（字符数）
    chunk-overlap: 50         # 切片重叠（避免信息截断）

# ==================== 混合 RAG 配置 ====================
rag:
  # 查询改写
  query:
    rewrite:
      variants: 2              # 改写变体数（越多效果越好，但越慢）

  # 向量检索
  retrieval:
    vector:
      top-k: 20                # 向量检索初始召回数
      threshold: 0.5           # 最低相似度阈值
    rrf:
      top-k: 10                # RRF 融合后保留数

  # Reranker 精排
  reranker:
    # 可选值：
    #   llm    - 内置 LLM 打分（默认，无额外依赖，利用已有 LLM）
    #   tfidf  - 内置 TF-IDF（纯 Java，延迟极低，无网络调用，效果较弱）
    #   bge    - 外部 BGE Python 服务（精度最高，需另行部署 Python 推理服务）
    #   cohere - Cohere Rerank API（云端，需 API Key）
    type: ${RERANKER_TYPE:llm}
    top-k: 5                   # 最终送给 LLM 的上下文数
    llm:
      batch-size: 5            # 每批发给 LLM 评分的文档数（避免超长 Prompt）
    bge:
      url: ${BGE_RERANKER_URL:http://localhost:8090/rerank}
    cohere:
      api-key: ${COHERE_API_KEY:}
      model: rerank-multilingual-v3.0

  # 内嵌 BM25 检索（基于 Apache Lucene，无需外部服务，始终可用）
  bm25:
    k1: ${BM25_K1:1.2}                # BM25 词频饱和参数（推荐 1.2~2.0）
    b:  ${BM25_B:0.75}                # BM25 文档长度归一化参数（推荐 0.5~0.9）

  # Elasticsearch（外部 BM25 检索，可选，需部署 ES 服务才能启用）
  # 启用后 Bm25Retriever 同时使用 Lucene（内嵌）和 ES（外部）双路 BM25，效果更好
  elasticsearch:
    enabled: ${ES_ENABLED:false}        # 设为 true 启用外部 ES（默认关闭，内嵌 Lucene 始终可用）
    host: ${ES_HOST:localhost}
    port: ${ES_PORT:9200}
    index-name: ${ES_INDEX:rag-documents}
    username: ${ES_USERNAME:}           # 留空表示无认证（开发环境）
    password: ${ES_PASSWORD:}
    # IK 中文分词器（需安装插件：bin/elasticsearch-plugin install analysis-ik）
    # 未安装时设为 false，自动使用 standard 分词器（英文效果好，中文效果较差）
    ik-analyzer: ${ES_IK_ANALYZER:true}

# 天气 API（OpenWeatherMap 免费版，申请地址：https://openweathermap.org/api）
weather:
  api:
    key: ${WEATHER_API_KEY:}    # 留空则降级返回提示，从 openweathermap.org 免费申请

# ==================== 邮件 SMTP 配置 ====================
# 启用邮件告警时需配置此节。以 Gmail 为例：
#   host: smtp.gmail.com
#   port: 587
#   username: your-account@gmail.com
#   password: your-app-password（开启两步验证后生成"应用密码"）


# ==================== 告警通知配置 ====================
llm:
  observability:
    alert:
      dingtalk:
        enabled: ${ALERT_DINGTALK_ENABLED:false}
        webhook: ${ALERT_DINGTALK_WEBHOOK:}
      wecom:
        enabled: ${ALERT_WECOM_ENABLED:false}
        webhook: ${ALERT_WECOM_WEBHOOK:}
      email:
        enabled: ${ALERT_EMAIL_ENABLED:false}
        to: ${ALERT_EMAIL_TO:}           # 多收件人用逗号分隔，如: ops@corp.com,cto@corp.com
        from: ${ALERT_EMAIL_FROM:ai-agent@example.com}
      custom:
        enabled: ${ALERT_CUSTOM_ENABLED:false}
        webhook: ${ALERT_CUSTOM_WEBHOOK:}

# ==================== JWT 认证配置 ====================
security:
  jwt:
    # 生产环境必须通过环境变量注入，至少 32 个字符
    secret: ${JWT_SECRET:change-this-secret-key-in-production-min-32-chars}
    expiration-seconds: ${JWT_EXPIRATION:86400}   # 默认 24 小时
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    per-day: ${RATE_LIMIT_PER_DAY:500}

# 知识库置信度阈值
kb:
  confidence-threshold: ${KB_CONFIDENCE_THRESHOLD:0.6}
