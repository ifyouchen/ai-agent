# ==================== JWT 认证配置 ====================
security:
  jwt:
    # 生产环境必须修改，至少 32 个字符
    secret: change-this-secret-key-in-production-min-32-chars
    expiration-seconds: 86400   # 默认 24 小时
  rate-limit:
    per-minute: 10
    per-day: 500

# 知识库置信度阈值
kb:
  confidence-threshold: 0.6