spring:
  profiles:
    active: deepseek,key   # 切换为 claude,key 即可换模型
  servlet:
    multipart:
      max-file-size: 50MB        # 单个文件最大大小
      max-request-size: 100MB    # 整个请求最大大小（支持多文件上传）
  data:
    redis:
      host: localhost
      port: 6379
      password:

  datasource:
    url: jdbc:postgresql://localhost:5432/aiagent
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*.xml      # XML 映射文件位置
  type-aliases-package: com.example.aiagent     # 实体类别名扫描包
  configuration:
    map-underscore-to-camel-case: true          # 自动将 snake_case 列名映射为 camelCase 字段
    default-fetch-size: 100
    default-statement-timeout: 30              # SQL 超时（秒）
    # 禁止 MyBatis 将 SQL 和参数直接打印到控制台。
    # 文档切片 content 会作为 SQL 参数写入/读取，开启 StdOutImpl 会泄露完整文档内容。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

server:
  port: 8080
  error:
    # 关闭 Whitelabel 错误页，使用自定义 JSON 错误处理（SecurityConfig 已配置）
    # 同时避免 SSE 异步线程中 "Cannot render error page for request [null]" 警告
    whitelabel:
      enabled: false
    # SSE 异步场景：异常发生时不尝试转发到 /error（SSE 响应已 committed 无法转发）
    path: /error

chat:
  stream:
    flush-interval-ms: 50
    flush-min-chars: 40
  react:
    # 专业模式（ReAct）使用更小的 flush 阈值，避免慢模型产生的卡顿感
    # pro 模型生成速度慢，40 字阈值会让每批次内容极少，视觉上每 50ms 才跳出几个字
    flush-interval-ms: 20    # 每 20ms 一次 flush（比快速模式更激进）
    flush-min-chars: 3       # 积累 3 个字即发出，不等满 40 个字

# 链路追踪（Zipkin）
# 开发环境未启动 Zipkin 时设为 never，避免连接错误日志
management:
  health:
    mail:
      enabled: false
    elasticsearch:
      enabled: false
  tracing:
    sampling:
      probability: 0.0    # 采样率 0 = 不上报（开发环境）
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      export:
        enabled: false    # 不向 Zipkin 上报

# 日志
logging:
  level:
    com.example.aiagent: INFO
    dev.langchain4j: INFO
    org.mybatis: INFO
    org.apache.ibatis: INFO
    java.sql: INFO
    jdbc.sqlonly: INFO
    jdbc.sqltiming: INFO
    jdbc.resultset: INFO
    jdbc.audit: INFO
    # 抑制 SSE 场景下 "Cannot render error page for request [null]" 的 ERROR 噪声日志
    # 根因已通过将 completeWithError 改为 complete 修复，此处仅做降噪
    org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration: OFF

# 应用前端地址（用于邮件中的链接，如组织邀请、密码重置）
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173} # 用于邮件绝对链接；生产环境设置为 https://your-domain.com
  org:
    invitation:
      ttl-hours: 72           # 组织邀请链接有效期（小时）

# Agent 配置
agent:
  memory:
    max-messages: 20          # 每个会话保留最近 N 条消息
    ttl-hours: 24             # Redis 中的记忆过期时间（小时）
  rag:
    max-results: 3            # RAG 检索返回最相关 N 段
    min-score: 0.7            # 相似度阈值（低于此值不返回）
    chunk-size: 800           # 文档切片大小（字符数）
    chunk-overlap: 120        # 切片重叠（避免信息截断）
    embedding-batch-size: 16  # Embedding API 单次批量上限（百度千帆 bge-large-zh 最大 16；OpenAI 可设 256）

# ==================== 混合 RAG 配置 ====================
rag:
  # 查询改写
  query:
    hyde:
      enabled: true            # true=保留 HyDE 检索质量；低延迟场景可关闭
    rewrite:
      variants: 2              # 0=仅用原始问题；2=多角度改写，召回更充分但会增加一次 LLM 调用

  cache:
    enabled: true
    ttl-seconds: 300

  # 向量检索
  retrieval:
    vector:
      top-k: 40                # 向量检索初始召回数
      threshold: 0.45          # 最低相似度阈值
    rrf:
      top-k: 25                # RRF 融合后保留数

  # Reranker 精排
  reranker:
    # 可选值：
    #   llm    - 内置 LLM 打分（无额外依赖，效果好，但需额外 LLM 调用，增加延迟 2~5s）
    #   tfidf  - 内置 TF-IDF（纯 Java，延迟极低，无网络调用，推荐流式对话场景）
    #   bge    - 外部 BGE Python 服务（精度最高，需另行部署 Python 推理服务）
    #   cohere - Cohere Rerank API（云端，需 API Key）
    #   qianfan - 百度千帆 Rerank API（国内云端精排，复用 qianfan.api-key）
    type: qianfan             # 国内云端精排；未配置 key 或调用失败时自动降级
    top-k: 8                   # 最终送给 LLM 的上下文数
    llm:
      batch-size: 5            # 每批发给 LLM 评分的文档数（避免超长 Prompt）
    qianfan:
      model: bce-reranker-base # 千帆官方 rerank 示例模型，可按账号开通情况替换
      max-documents: 64        # 千帆 rerank documents 官方上限
      url: ${QIANFAN_RERANK_URL:}

  # 内嵌 BM25 检索（基于 Apache Lucene，无需外部服务，始终可用）
  bm25:
    analyzer: smartcn      # smartcn=中文分词；standard=英文/空格分词
    k1: 1.2                # BM25 词频饱和参数（推荐 1.2~2.0）
    b:  0.75               # BM25 文档长度归一化参数（推荐 0.5~0.9）
    # 索引存储目录（可选持久化）：
    #   留空（默认）→ ByteBuffersDirectory（内存，重启需重建，适合开发/小规模）
    #   填路径     → MMapDirectory（磁盘持久化，重启直接可用，适合生产）
    #   生产示例：index-dir: /data/lucene-index
    index-dir: ""

# ==================== 邮件 SMTP 配置 ====================
# 启用邮件验证码/邀请/告警时需配置此节。以 Gmail 为例：
# spring:
#   mail:
#     host: smtp.gmail.com
#     port: 587
#     username: your-account@gmail.com
#     password: your-app-password
#     protocol: smtp
#     default-encoding: UTF-8
#     properties:
#       mail.smtp.auth: true
#       mail.smtp.starttls.enable: true

# 邮件发件人（可选，未指定时使用 spring.mail.username）
# auth:
#   email:
#     from: noreply@example.com


# ==================== 告警通知配置 ====================
llm:
  observability:
    alert:
      dingtalk:
        enabled: false
      wecom:
        enabled: false
      email:
        enabled: false
        to:                    # 多收件人用逗号分隔，如: ops@corp.com,cto@corp.com
        from: ai-agent@example.com
      custom:
        enabled: false

# ==================== JWT 认证配置 ====================
security:
  jwt:
    # 【必须修改！】生产环境请通过环境变量 JWT_SECRET 注入，或在此配置至少 32 字符的随机字符串
    # 生成命令：openssl rand -base64 32
    # 当前值仅用于本地开发，启动时会检查是否为弱密钥，如在生产使用将阻止启动
    # 开发环境内置 secret（仅限本地开发，长度满足 32 位且不含弱密钥关键词）
    # 生产环境请通过 JWT_SECRET 环境变量注入强随机密钥：openssl rand -base64 32
    secret: ${JWT_SECRET:local-dev-jwt-secret-key-not-for-prod}
    expiration-seconds: 86400   # 默认 24 小时
  rate-limit:
    per-minute: 10
    per-day: 500

auth:
  email:
    code-ttl-minutes: 10
    resend-cooldown-seconds: 60
    max-attempts: 5

# 知识库置信度阈值
kb:
  confidence-threshold: 0.6
