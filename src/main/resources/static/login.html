<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent — 登录</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #F7F8FA;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            color: #1A1A1A;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;          /* 两侧留白，卡片不贴边 */
        }

        /* ── 整体容器 ── */
        .page-wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1040px;
            min-height: 620px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 40px rgba(0,0,0,.08);
            /* 不设 margin，由 body padding 控制两侧空白 */
        }

        /* ══════════════════════════════
           左侧品牌区（桌面可见）
        ══════════════════════════════ */
        .brand-panel {
            width: 48%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 52px 0;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            top: -160px; right: -100px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(77,107,254,.07) 0%, transparent 65%);
            pointer-events: none;
        }

        .brand-panel::after {
            content: '';
            position: absolute;
            bottom: -100px; left: -60px;
            width: 360px; height: 360px;
            background: radial-gradient(circle, rgba(77,107,254,.05) 0%, transparent 65%);
            pointer-events: none;
        }

        .brand-inner {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 0 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 48px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .brand-top { display: flex; flex-direction: column; gap: 0; }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .brand-logo-icon {
            width: 32px; height: 32px;
            background: #4D6BFE;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(77,107,254,.3);
        }

        .brand-logo-icon svg { width: 17px; height: 17px; fill: #fff; }

        .brand-logo-text {
            font-size: 16px;
            font-weight: 600;
            color: #1A1A1A;
            letter-spacing: -.2px;
        }

        .brand-headline {
            font-size: 34px;
            font-weight: 700;
            line-height: 1.28;
            letter-spacing: -.8px;
            color: #111111;
            margin-bottom: 16px;
        }

        .brand-headline span { color: #4D6BFE; }

        .brand-desc {
            font-size: 15px;
            color: #666666;
            line-height: 1.7;
        }

        .brand-features {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .brand-feature {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555555;
            font-size: 13.5px;
        }

        .brand-feature-dot {
            width: 6px; height: 6px;
            background: #4D6BFE;
            border-radius: 50%;
            flex-shrink: 0;
            opacity: .8;
        }

        .brand-bottom {
            position: relative;
            z-index: 1;
            font-size: 12px;
            color: #BBBBBB;
            padding: 0 48px;
        }

        /* ══════════════════════════════
           右侧表单区
        ══════════════════════════════ */
        .form-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 56px;
            background: #F7F8FA;
        }

        /* 移动端品牌区（桌面隐藏） */
        .mobile-brand {
            display: none;
        }

        .form-box {
            width: 100%;
            max-width: 360px;
        }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 6px;
            letter-spacing: -.4px;
        }

        .form-subtitle {
            font-size: 14px;
            color: #888888;
            margin-bottom: 32px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 28px;
            border-bottom: 1px solid #E8E8E8;
        }

        .auth-tab {
            padding: 9px 0;
            margin-right: 24px;
            font-size: 14px;
            font-weight: 500;
            color: #AAAAAA;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color .15s, border-color .15s;
            font-family: inherit;
        }

        .auth-tab:hover { color: #555555; }
        .auth-tab.active { color: #111111; border-bottom-color: #4D6BFE; }

        .auth-form { display: none; }
        .auth-form.active { display: block; }

        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444444;
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            color: #1A1A1A;
            background: #FFFFFF;
            transition: border-color .15s, box-shadow .15s;
            outline: none;
            font-family: inherit;
        }

        .form-input::placeholder { color: #C0C0C0; }
        .form-input:hover { border-color: #C8C8C8; }

        .form-input:focus {
            border-color: #4D6BFE;
            box-shadow: 0 0 0 3px rgba(77,107,254,.1);
        }

        .form-input.error {
            border-color: #E53E3E;
            box-shadow: 0 0 0 3px rgba(229,62,62,.08);
        }

        .form-error {
            font-size: 12px;
            color: #E53E3E;
            margin-top: 5px;
            display: none;
        }
        .form-error.visible { display: block; }

        .global-error {
            background: #FFF5F5;
            border: 1px solid #FED7D7;
            border-radius: 7px;
            padding: 10px 13px;
            color: #C53030;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            line-height: 1.5;
        }
        .global-error.visible { display: block; }

        .submit-btn {
            width: 100%;
            padding: 11px;
            background: #4D6BFE;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, box-shadow .15s, transform .1s;
            margin-top: 6px;
            font-family: inherit;
        }

        .submit-btn:hover {
            background: #3A5AF0;
            box-shadow: 0 4px 14px rgba(77,107,254,.35);
        }
        .submit-btn:active  { transform: scale(.98); box-shadow: none; }
        .submit-btn:disabled {
            background: #A8B8FD;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: inline-block;
            width: 13px; height: 13px;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ══════════════════════════════
           移动端响应式（≤ 768px）
        ══════════════════════════════ */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                background: #FFFFFF;
                padding: 0;              /* 移动端不需要两侧留白 */
            }

            /* 容器变为纵向，撑满整屏 */
            .page-wrapper {
                flex-direction: column;   /* ← 核心：改为上下排列 */
                max-width: 100%;
                min-height: 100vh;
                border-radius: 0;
                margin: 0;
                box-shadow: none;
            }

            /* 桌面左侧品牌区：完全隐藏 */
            .brand-panel { display: none; }

            /* 移动端品牌区：显示在顶部 */
            .mobile-brand {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 48px 32px 36px;
                background: #FFFFFF;
                border-bottom: 1px solid #F0F0F0;
            }

            .mobile-brand-logo {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 20px;
            }

            .mobile-brand-logo-icon {
                width: 32px; height: 32px;
                background: #4D6BFE;
                border-radius: 8px;
                display: flex; align-items: center; justify-content: center;
                box-shadow: 0 2px 8px rgba(77,107,254,.3);
                flex-shrink: 0;
            }

            .mobile-brand-logo-icon svg { width: 17px; height: 17px; fill: #fff; }

            .mobile-brand-logo-text {
                font-size: 17px;
                font-weight: 600;
                color: #1A1A1A;
                letter-spacing: -.2px;
            }

            .mobile-brand-headline {
                font-size: 22px;
                font-weight: 700;
                color: #111111;
                line-height: 1.3;
                letter-spacing: -.5px;
                margin-bottom: 10px;
            }

            .mobile-brand-headline span { color: #4D6BFE; }

            .mobile-brand-desc {
                font-size: 13px;
                color: #888888;
                line-height: 1.6;
            }

            /* 表单区：纵向，占剩余空间 */
            .form-panel {
                flex: 1;
                width: 100%;
                padding: 36px 24px 48px;
                background: #FFFFFF;
                justify-content: flex-start;
                align-items: stretch;
            }

            .form-box { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <!-- 左侧品牌区（桌面可见，移动端隐藏） -->
    <div class="brand-panel">
        <div class="brand-inner">
            <div class="brand-top">
                <div class="brand-logo">
                    <div class="brand-logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                        </svg>
                    </div>
                    <span class="brand-logo-text">AI Agent</span>
                </div>
                <div class="brand-headline">企业级<br><span>智能对话</span>平台</div>
                <p class="brand-desc">基于大语言模型的企业知识库与智能助手，支持文档问答、多步推理与业务系统集成。</p>
            </div>
            <div class="brand-features">
                <div class="brand-feature"><div class="brand-feature-dot"></div>混合 RAG 知识库，精准引用溯源</div>
                <div class="brand-feature"><div class="brand-feature-dot"></div>ReAct 多步推理，复杂任务自动拆解</div>
                <div class="brand-feature"><div class="brand-feature-dot"></div>DeepSeek / Claude 多模型热切换</div>
                <div class="brand-feature"><div class="brand-feature-dot"></div>Token 成本追踪与智能告警</div>
            </div>
        </div>
        <div class="brand-bottom">© 2026 AI Agent Platform</div>
    </div>

    <!-- 右侧表单区 -->
    <div class="form-panel">

        <!-- 移动端品牌信息（桌面隐藏，移动端显示在表单上方） -->
        <div class="mobile-brand">
            <div class="mobile-brand-logo">
                <div class="mobile-brand-logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                    </svg>
                </div>
                <span class="mobile-brand-logo-text">AI Agent</span>
            </div>
            <div class="mobile-brand-headline">企业级<span>智能对话</span>平台</div>
            <p class="mobile-brand-desc">文档问答 · 多步推理 · 业务系统集成</p>
        </div>

        <div class="form-box">
            <div class="form-title">欢迎回来</div>
            <div class="form-subtitle">登录以继续使用 AI Agent</div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">登录</button>
                <button class="auth-tab" id="tab-register">注册</button>
            </div>

            <div class="global-error" id="globalError"></div>

            <!-- 登录表单 -->
            <form class="auth-form active" id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginUsername">用户名</label>
                    <input class="form-input" id="loginUsername" type="text"
                           placeholder="输入用户名" autocomplete="username">
                    <div class="form-error" id="loginUsernameError">请输入用户名</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">密码</label>
                    <input class="form-input" id="loginPassword" type="password"
                           placeholder="输入密码" autocomplete="current-password">
                    <div class="form-error" id="loginPasswordError">请输入密码</div>
                </div>
                <button class="submit-btn" type="submit" id="loginBtn">登录</button>
            </form>

            <!-- 注册表单 -->
            <form class="auth-form" id="registerForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="regUsername">用户名</label>
                    <input class="form-input" id="regUsername" type="text"
                           placeholder="4-32 位字母或数字" autocomplete="username">
                    <div class="form-error" id="regUsernameError">用户名需为 4-32 位字母或数字</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPassword">密码</label>
                    <input class="form-input" id="regPassword" type="password"
                           placeholder="至少 6 位" autocomplete="new-password">
                    <div class="form-error" id="regPasswordError">密码不能少于 6 位</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="regConfirm">确认密码</label>
                    <input class="form-input" id="regConfirm" type="password"
                           placeholder="再次输入密码" autocomplete="new-password">
                    <div class="form-error" id="regConfirmError">两次密码不一致</div>
                </div>
                <button class="submit-btn" type="submit" id="registerBtn">注册并登录</button>
            </form>
        </div>

    </div>

</div>

<script type="module">
    const TOKEN_KEY = 'ai_agent_token';
    const USER_KEY  = 'ai_agent_user';

    if (localStorage.getItem(TOKEN_KEY)) location.replace('/index.html');

    const tabLogin     = document.getElementById('tab-login');
    const tabRegister  = document.getElementById('tab-register');
    const loginForm    = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const globalError  = document.getElementById('globalError');
    const formTitle    = document.querySelector('.form-title');
    const formSubtitle = document.querySelector('.form-subtitle');

    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        formTitle.textContent    = '欢迎回来';
        formSubtitle.textContent = '登录以继续使用 AI Agent';
        clearErrors();
    });

    tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        formTitle.textContent    = '创建账号';
        formSubtitle.textContent = '注册后即可开始使用';
        clearErrors();
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!validateLogin(username, password)) return;
        const btn = document.getElementById('loginBtn');
        setLoading(btn, true, '登录中');
        try {
            const data = await callApi('/api/v1/auth/login', { username, password });
            saveAuth(data);
            location.replace('/index.html');
        } catch (err) {
            showGlobalError(err.message || '用户名或密码错误');
        } finally {
            setLoading(btn, false, '登录');
        }
    });

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm  = document.getElementById('regConfirm').value;
        if (!validateRegister(username, password, confirm)) return;
        const btn = document.getElementById('registerBtn');
        setLoading(btn, true, '注册中');
        try {
            const data = await callApi('/api/v1/auth/register', { username, password });
            saveAuth(data);
            location.replace('/index.html');
        } catch (err) {
            showGlobalError(err.message || '注册失败，用户名可能已存在');
        } finally {
            setLoading(btn, false, '注册并登录');
        }
    });

    function validateLogin(u, p) {
        let ok = true;
        if (!u) { showFieldError('loginUsername', 'loginUsernameError', '请输入用户名'); ok = false; }
        if (!p) { showFieldError('loginPassword', 'loginPasswordError', '请输入密码');  ok = false; }
        return ok;
    }

    function validateRegister(u, p, c) {
        let ok = true;
        if (!u || !/^[a-zA-Z0-9]{4,32}$/.test(u)) {
            showFieldError('regUsername', 'regUsernameError', '用户名需为 4-32 位字母或数字'); ok = false;
        }
        if (!p || p.length < 6) {
            showFieldError('regPassword', 'regPasswordError', '密码不能少于 6 位'); ok = false;
        }
        if (p !== c) {
            showFieldError('regConfirm', 'regConfirmError', '两次密码不一致'); ok = false;
        }
        return ok;
    }

    async function callApi(url, body) {
        const res  = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
        return data;
    }

    function saveAuth(data) {
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(USER_KEY, JSON.stringify({
            userId: data.userId, username: data.username, roles: data.roles
        }));
    }

    function showFieldError(inputId, errorId, msg) {
        document.getElementById(inputId)?.classList.add('error');
        const el = document.getElementById(errorId);
        if (el) { el.textContent = msg; el.classList.add('visible'); }
    }

    function showGlobalError(msg) {
        globalError.textContent = msg;
        globalError.classList.add('visible');
    }

    function clearErrors() {
        globalError.classList.remove('visible');
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
        document.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
    }

    function setLoading(btn, loading, text) {
        btn.disabled = loading;
        btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
    }
</script>
</body>
</html>
