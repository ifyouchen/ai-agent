<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 对话</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-logo">
        <h1>
            <div class="logo-icon">🤖</div>
            AI Agent
        </h1>
    </div>

    <div class="sidebar-section">
        <button class="new-chat-btn" id="newChatBtn">
            ✏️ 新建对话
        </button>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-section-title">最近对话</div>
    </div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-bottom">
        <div class="sidebar-section-title"
             style="padding:0; margin-bottom:8px; color:rgba(255,255,255,.4);
                    font-size:11px; font-weight:600; letter-spacing:.8px; text-transform:uppercase;">
            当前模型
        </div>
        <select class="model-selector" id="modelSelector">
            <option value="deepseek">🔵 DeepSeek（默认）</option>
            <option value="claude">🟣 Claude</option>
        </select>
    </div>
</div>

<!-- 主区域 -->
<div class="main">
    <!-- 顶部栏 -->
    <div class="topbar">
        <div class="topbar-title" id="topbarTitle">新对话</div>
        <div class="topbar-actions">
            <button class="topbar-btn danger" id="clearMemoryBtn">🗑️ 清除记忆</button>
            <button class="topbar-btn" id="kbShortcutBtn">📚 知识库</button>
        </div>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
        <div class="tab active" id="tab-chat" data-tab="chat">💬 对话</div>
        <div class="tab" id="tab-kb" data-tab="kb">📚 知识库</div>
    </div>

    <!-- 内容区 -->
    <div class="content">

        <!-- 对话面板 -->
        <div class="tab-panel active" id="panel-chat">
            <div class="chat-messages" id="chatMessages">
                <!-- 欢迎页（由 chat.js 动态渲染） -->
                <div class="welcome" id="welcomeScreen">
                    <div class="welcome-icon">🤖</div>
                    <h2>你好，我是 AI Agent</h2>
                    <p>我可以回答问题、查询信息、帮你完成各种任务</p>
                    <div class="quick-prompts" id="quickPrompts">
                        <div class="quick-prompt" data-msg="帮我查一下订单 #12345 的状态">📦 查询订单状态</div>
                        <div class="quick-prompt" data-msg="北京今天天气怎么样？">🌤️ 查询天气</div>
                        <div class="quick-prompt" data-msg="帮我介绍一下你能做什么">🤔 了解功能</div>
                        <div class="quick-prompt" data-msg="查询用户 U001 的账户余额">💰 查询账户</div>
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="输入消息，Ctrl+Enter 发送..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
                <div class="input-hints">
                    <span class="hint-text">Ctrl+Enter 发送 · Enter 换行</span>
                    <label class="stream-toggle" title="开启后文字逐步显示">
                        <div class="toggle on" id="streamToggle"></div>
                        <span>流式输出</span>
                    </label>
                    <label class="stream-toggle" title="多步推理：适合复杂任务（查订单+统计金额等）">
                        <div class="toggle" id="reactToggle"></div>
                        <span>🧠 深度推理</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 知识库面板 -->
        <div class="tab-panel" id="panel-kb">
            <div class="kb-panel">
                <!-- 上传区 -->
                <div class="kb-upload-area" id="uploadArea">
                    <div class="kb-upload-icon">📄</div>
                    <div class="kb-upload-title">上传文档到知识库</div>
                    <div class="kb-upload-desc">支持 PDF、Word、TXT、Markdown 等格式 · 拖拽或点击上传 · 最大 50MB</div>
                    <button class="upload-btn">选择文件</button>
                    <input type="file" id="fileInput" multiple
                           accept=".pdf,.doc,.docx,.txt,.md">
                </div>

                <!-- 上传进度 -->
                <div class="upload-progress" id="uploadProgress">
                    <div class="progress-info">
                        <span class="progress-filename" id="progressFilename">上传中...</span>
                        <span class="progress-pct" id="progressPct">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <!-- 文档列表 -->
                <div class="kb-docs-title">已导入文档</div>
                <div id="docList">
                    <div class="empty-docs">📭 暂无文档，上传后 AI 可基于文档内容回答</div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<!-- 快速认证守卫：在模块加载前判断是否已登录，未登录立即跳转（避免页面内容闪烁） -->
<script>
    (function () {
        if (!localStorage.getItem('ai_agent_token')) {
            location.replace('/login.html');
        }
    })();
</script>

<!-- ES Module 入口（type="module" 原生支持，无需构建工具） -->
<script type="module" src="/js/app.js"></script>

</body>
</html>
